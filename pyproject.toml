[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-inspector"
description = "Finds the parts of a sliced 3D print that nothing holds up, and shows them in a 3D viewer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
dynamic = ["version"]
keywords = ["3d-printing", "gcode", "supports", "overhang", "slicer"]

[project.urls]
Homepage = "https://github.com/andtdev/3D_print_support_inspector"

[project.scripts]
support-inspector = "support_inspector.cli:main"

[tool.setuptools]
packages = ["support_inspector"]

[tool.setuptools.dynamic]
version = {attr = "support_inspector.__version__"}

[tool.setuptools.package-data]
support_inspector = ["viewer_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
